name: Build, QA and Deploy Briscola Web

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "briscola-${{ github.ref }}"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"
  GODOT_TEMPLATE_VERSION: "4.3.stable"
  BRISCOLA_VERSION: "0.8.3-rc7"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Release audit
        run: python3 tools/release_audit.py

      - name: Cache Godot runtime and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/briscola-godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: briscola-godot-${{ runner.os }}-4.3-stable-v1

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euxo pipefail
          CACHE_DIR="$HOME/.cache/briscola-godot"
          CACHED_GODOT="$CACHE_DIR/godot"
          mkdir -p "$CACHE_DIR"
          if [ ! -x "$CACHED_GODOT" ]; then
            curl -fL --retry 3 \
              -o /tmp/godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            rm -rf /tmp/godot
            unzip -q /tmp/godot.zip -d /tmp/godot
            GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
            test -n "$GODOT_BIN"
            install -m 0755 "$GODOT_BIN" "$CACHED_GODOT"
          fi
          sudo install -m 0755 "$CACHED_GODOT" /usr/local/bin/godot
          godot --version

      - name: Install official Godot export templates
        shell: bash
        run: |
          set -euxo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/web_nothreads_release.zip" ]; then
            curl -fL --retry 3 \
              -o /tmp/export_templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            rm -rf /tmp/godot-templates
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi

          test -f "$TEMPLATE_DIR/web_release.zip"
          test -f "$TEMPLATE_DIR/web_debug.zip"
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -f "$TEMPLATE_DIR/web_nothreads_debug.zip"

      - name: Import assets and validate scripts
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --quit
          grep -n "import_etc2_astc" project.godot
          test -d .godot

      - name: Run Briscola engine self-test
        run: godot --headless --path . -s res://scripts/self_test.gd

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.js
          test -f build/web/index.wasm
          test -f build/web/index.pck
          printf '%s\n' "$BRISCOLA_VERSION" > build/web/version.txt
          printf '%s\n' "$GITHUB_SHA" > build/web/commit.txt

      - name: Copy browser / PWA brand assets
        shell: bash
        run: |
          set -euxo pipefail
          cp assets/pwa/apple-touch-icon.png build/web/apple-touch-icon.png
          cp assets/pwa/icon-192.png build/web/icon-192.png
          cp assets/pwa/icon-512.png build/web/icon-512.png

      - name: Add production Web shell, support and monitoring hooks
        env:
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          ERROR_REPORT_ENDPOINT: ${{ vars.ERROR_REPORT_ENDPOINT }}
          PLAYTEST_ENDPOINT: ${{ vars.PLAYTEST_ENDPOINT }}
        run: python3 tools/postprocess_web.py

      - name: Guard Web bundle size
        shell: bash
        run: |
          set -euxo pipefail
          BYTES="$(du -sb build/web | awk '{print $1}')"
          echo "Web bundle bytes: $BYTES"
          test "$BYTES" -lt 50000000
          {
            echo "### Briscola Web build"
            echo "- Version: $BRISCOLA_VERSION"
            echo "- Bundle: $BYTES bytes"
            echo "- Godot: $GODOT_RELEASE"
            if [ -n "${{ vars.ERROR_REPORT_ENDPOINT }}" ]; then
              echo "- Error monitoring: remote endpoint configured"
            else
              echo "- Error monitoring: local diagnostics only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test exported site
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 --directory build/web >/tmp/briscola-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for _i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/tmp/briscola-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/briscola-index.html
          curl -fsS -o /dev/null http://127.0.0.1:8765/index.js
          curl -fsS -o /dev/null http://127.0.0.1:8765/index.wasm
          curl -fsS -o /dev/null http://127.0.0.1:8765/index.pck
          curl -fsS -o /dev/null http://127.0.0.1:8765/runtime.js
          curl -fsS -o /dev/null http://127.0.0.1:8765/manifest.webmanifest
          curl -fsS -o /dev/null http://127.0.0.1:8765/service-worker.js
          curl -fsS -o /dev/null http://127.0.0.1:8765/icon-192.png
          curl -fsS -o /dev/null http://127.0.0.1:8765/icon-512.png

      - name: Setup Node for cross-browser QA
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Playwright browsers and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: briscola-playwright-${{ runner.os }}-1.63.0-v1

      - name: Install Playwright QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser save/resume QA
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8765 --directory build/web >/tmp/briscola-playwright-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PLAYWRIGHT_TEST_BASE_URL=http://127.0.0.1:8765 npm run test:browser

      - name: Upload browser QA report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Archive Web build for rollback
        if: ${{ success() }}
        uses: actions/upload-artifact@v5
        with:
          name: briscola-web-${{ github.sha }}
          path: build/web
          retention-days: 30
          if-no-files-found: error

      - name: Configure Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: ${{ github.event_name == 'push' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
