name: Deploy Godot Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: lihop/setup-godot@v3
        with:
          version: 4.3-stable
          export-templates: true

      - name: Show Godot setup
        run: |
          godot --version
          echo "HOME=$HOME"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -print | head -30 || true

      - name: Import assets
        run: godot --headless --editor --path . --quit

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
